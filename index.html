<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track your workouts and build consistency."><title>FitForge</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Personal dashboard</div><h1>FitForge</h1><p class="muted">Track your workouts and build consistency.</p></div><span class="pill">Offline • Private</span></header><div class="grid"><section class="card"><div class="muted">Workouts</div><div class="metric" id="s0">0</div></section><section class="card"><div class="muted">Total minutes</div><div class="metric" id="s1">0</div></section><section class="card"><div class="muted">Calories (estimate)</div><div class="metric" id="s2">0</div></section></div><section class="card"><h2>Add new</h2><form><input id="desc" placeholder="Exercise (e.g. Running)" maxlength="70" required><input id="minutes" type="number" min="1" max="1440" placeholder="Minutes" required><select id="intensity"><option value="light">Light</option><option value="moderate">Moderate</option><option value="vigorous">Vigorous</option></select><button>Log workout</button></form></section><section class="card" style="margin-top:18px"><h2>Workout history</h2><ul id="list"></ul></section><footer>Data is saved in this browser using localStorage. No account or server needed.</footer></main><script src="app.js"></script></body></html>
